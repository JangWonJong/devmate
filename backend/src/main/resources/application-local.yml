spring:
  datasource:
    url: jdbc:mysql://localhost:3306/devmate
    username: root
    password: 1004
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  flyway:
    enabled: false
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: "devmate-secret-key-change-this-in-real"
  access-exp-min: 15
  refresh-exp-days: 7

file:
  upload-dir: C:/WJ/devmate/uploads

openai:
  api-key: ${OPENAI_API_KEY}
  model: gpt-4.1-mini
  url: https://api.openai.com/v1/responses