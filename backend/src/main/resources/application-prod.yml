spring:
  datasource:
    url: jdbc:mysql://localhost:3306/devmate
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  access-exp-min: 15
  refresh-exp-days: 7

file:
  upload-dir: /home/ubuntu/devmate/uploads